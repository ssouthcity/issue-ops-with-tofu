name: "Sticky Comment"
description: "Create or update a comment on a GitHub issue or PR"
inputs:
  issue-number:
    description: "ID of the issue to comment on"
    required: true
    default: ${{ github.event.issue.number }}
  body:
    description: "Comment body"
    required: true
  token:
    description: "GitHub token"
    required: true
    default: ${{ github.token }}
  owner:
    description: "Owner of the repo"
    required: true
    default: ${{ github.event.repository.owner }}
  repo:
    description: "Name of the repo"
    required: true
    default: ${{ github.event.repository.name }}
  marker:
    description: "HTML comment used to identity the comment when updating"
    required: true
    default: "<!-- sticky-comment: workflow=${{ github.workflow }} -->"
outputs:
  comment-id:
    description: "ID of the comment"
    value: ${{ steps.create_comment.outputs.comment_id || steps.update_comment.outputs.comment_id }}
runs:
  using: "composite"
  steps:
    - name: Get existing comment
      id: get_existing_comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        MARKER: ${{ inputs.marker }}
      run: |
        COMMENT_ID="$(gh api "repos/$OWNER/$REPO/issues/$ISSUE_NUMBER/comments" \
          --method GET \
          --jq '.[] | select(.body | contains(env.MARKER)) | .id' | head -n 1)"

        echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

    - name: Construct Body
      id: body
      shell: bash
      env:
        BODY: ${{ inputs.body }}
        MARKER: ${{ inputs.marker }}
      run: |
        {
          echo 'result=EOF'
          printf '%s\n\n%s\n' "$MARKER" "$BODY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - if: ${{ steps.get_existing_comment.outputs.comment_id == "" }}
      id: create_comment
      name: Create Comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BODY: ${{ steps.body.outputs.result }}
      run: |
        COMMENT_ID="$(gh api "repos/$OWNER/$REPO/issues/$ISSUE_NUMBER/comments" \
          --method POST \
          --raw-field body="$BODY" \
          --jq '.id')"

        echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

    - if: ${{ steps.get_existing_comment.outputs.comment_id != "" }}
      id: update_comment
      name: Update Comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        COMMENT_ID: ${{ steps.get_existing_comment.outputs.comment_id }}
        BODY: ${{ steps.body.outputs.result }}
      run: |
        COMMENT_ID="$(gh api "repos/$OWNER/$REPO/issues/comments/$COMMENT_ID" \
          --method PATCH \
          --raw-field body="$BODY" \
          --jq '.id')"

        echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
