name: Unlock on Merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  unlock-on-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: unlock on merge
        uses: github/branch-deploy@f0984057ffe1aa340aa017b6eafb894310aed88e # v12.0.0
        with:
          environment: live
          unlock_on_merge: true
