name: branch-deploy

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request }}
    environment:
      name: live
      deployment: false
    env:
      TG_NO_COLOR: "true"
      TG_NON_INTERACTIVE: "true"
    steps:
      - name: branch-deploy
        id: branch-deploy
        uses: github/branch-deploy@f0984057ffe1aa340aa017b6eafb894310aed88e # v12.0.0
        with:
          environment: live

      - name: Checkout
        if: steps.branch-deploy.outputs.continue == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch-deploy.outputs.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.branch-deploy.outputs.continue == 'true'

      - name: Terragrunt plan
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' }}
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STATE_S3_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_S3_ACCESS_KEY }}
          CLOUDFLARE_STATE_S3_ACCESS_SECRET: ${{ secrets.CLOUDFLARE_STATE_S3_ACCESS_SECRET }}
        run: terragrunt run --all -- plan | tee "$RUNNER_TEMP/terragrunt-stdout.txt"
        continue-on-error: true

      - name: Terragrunt apply
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        id: apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STATE_S3_ACCESS_KEY: ${{ secrets.CLOUDFLARE_STATE_S3_ACCESS_KEY }}
          CLOUDFLARE_STATE_S3_ACCESS_SECRET: ${{ secrets.CLOUDFLARE_STATE_S3_ACCESS_SECRET }}
        run: terragrunt run --all -- apply | tee "$RUNNER_TEMP/terragrunt-stdout.txt"
        continue-on-error: true

      - name: Terragrunt output
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        run: |
          delimiter="branch_deploy_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          while printf '%s\n' "$TF_STDOUT" | grep -Fxq "$delimiter"; do
            delimiter="branch_deploy_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          done
          {
            printf 'DEPLOY_MESSAGE<<%s\n' "$delimiter"
            printf '%s\n' '```terraform'
            cat "$RUNNER_TEMP/terragrunt-stdout.txt"
            printf '%s\n' '```'
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Check Terraform plan output
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' && steps.plan.outcome == 'failure' }}
        run: exit 1

      - name: Check Terraform apply output
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' && steps.apply.outcome == 'failure' }}
        run: exit 1
